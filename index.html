<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰箱贴裁剪排版工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#1f1d1a;--sub:#7a746b;--line:#e6e1d8;--acc:#e8553d;--acc2:#fff1ed;--r:12px}
*{box-sizing:border-box}
html{color-scheme:light}
html,body{margin:0;height:100%}
button,input,select,option,textarea,a.btn{color:var(--ink);-webkit-text-fill-color:currentColor}
a.btn{text-decoration:none;display:inline-block}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:700}
header .tip{color:var(--sub);font-size:12.5px}
.app{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 53px)}
aside{overflow:auto;padding:14px;border-right:1px solid var(--line);background:var(--panel)}
section.sec{margin-bottom:16px}
.sec h3{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600;letter-spacing:.5px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{font-size:12.5px;color:var(--sub);min-width:52px}
input[type=number],select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff;width:76px}
select{width:auto;min-width:120px}
.unit{color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:#bbb}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.drop{border:1.5px dashed #d4cdc1;border-radius:var(--r);padding:16px;text-align:center;color:var(--sub);cursor:pointer;background:#faf8f5}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.drop b{color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.item canvas{width:52px;height:52px;flex:none;cursor:pointer;border-radius:6px;background:#f2efe9}
.item .meta{flex:1;min-width:0}
.item .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .warn{font-size:11.5px;color:#c27a00}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-top:3px}
.step button{border:0;background:none;width:24px;height:24px;cursor:pointer;font-size:15px}
.step span{min-width:22px;text-align:center;font-size:12.5px}
.ico{border:0;background:none;cursor:pointer;color:var(--sub);font-size:13px;padding:4px 6px;border-radius:6px}
.ico:hover{background:#f2efe9;color:var(--ink)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.info{flex:1;color:var(--sub);font-size:13px;min-width:200px}
.info b{color:var(--ink)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px 16px;position:relative}
#pv{box-shadow:0 6px 30px rgba(60,40,20,.15);border-radius:2px;cursor:pointer;background:#fff}
.pager{display:flex;gap:4px;align-items:center}
.hint{color:var(--sub);font-size:12px;padding:0 16px 12px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.card{background:#fff;border-radius:16px;padding:16px;width:min(520px,100%);max-height:100%;overflow:auto}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
#edc{width:100%;aspect-ratio:1;border-radius:12px;touch-action:none;cursor:grab;display:block;background:#2a2a2e}
#edc:active{cursor:grabbing}
.edtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.tsum{background:var(--acc2);color:var(--acc);border-radius:8px;padding:7px 10px;font-size:12.5px}
.tsum.off{background:#f2efe9;color:var(--sub)}
.auto{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;cursor:pointer}
.auto input{accent-color:var(--acc);width:16px;height:16px}
.adv{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px}
.adv summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600;list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv[open] summary{margin-bottom:10px}
.cnt{font-size:12.5px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.small{font-size:12px;color:var(--sub)}
#fbimg{max-width:100%;max-height:60vh;display:block;margin:0 auto 10px;border:1px solid var(--line)}
@media (max-width:820px){
 .app{grid-template-columns:1fr;height:auto}
 aside{border-right:0;border-bottom:1px solid var(--line)}
 .stage{min-height:70vh}
 header .tip{display:none}
}
</style>
</head>
<body>
<header>
  <h1>🧲 冰箱贴裁剪排版</h1>
  <span class="tip">上传图片 → 在形状里拖动/缩放裁剪 → 自动排满相纸 → 导出打印</span>
</header>
<div class="app">
<aside>
  <section class="sec">
    <h3>① 选模板</h3>
    <div class="row"><label>相纸</label><div class="chips" id="tPaper"></div></div>
    <div class="row"><label>每张放</label><div class="chips" id="tCount"></div></div>
    <div class="row"><label>形状</label>
      <div class="seg" id="tShape"><button data-v="square">方形</button><button data-v="round">圆角</button><button data-v="circle">圆形</button><button data-v="fill">铺满长方</button></div></div>
    <div class="row"><label>间隙</label>
      <div class="seg" id="tGap"><button data-v="0">无</button><button data-v="2">窄 2mm</button><button data-v="4">宽 4mm</button></div></div>
    <div class="tsum" id="tSum"></div>
  </section>

  <section class="sec">
    <h3>② 加图片</h3>
    <div class="drop" id="drop"><b>点击选择</b> / 拖入 / 直接 Ctrl+V 粘贴图片<br><span class="small">可一次选多张</span></div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <label class="auto"><input type="checkbox" id="autoChk"> 自动排满整页 <span class="small">（多张图平均分配）</span></label>
    <div class="list" id="list"></div>
  </section>

  <details class="adv" id="adv">
  <summary>⚙️ 高级自定义</summary>
  <section class="sec">
    <h3>冰箱贴尺寸</h3>
    <div class="chips" id="mpresets"></div>
    <div class="row" style="margin-top:10px">
      <label>形状</label>
      <div class="seg" id="shapeSeg">
        <button data-v="rect">方形</button><button data-v="round">圆角</button><button data-v="ellipse">圆/椭圆</button>
      </div>
    </div>
    <div class="row"><label>宽 × 高</label><input type="number" data-k="w" min="5" step="0.5"><span>×</span><input type="number" data-k="h" min="5" step="0.5"><span class="unit">mm</span></div>
    <div class="row" id="rRow"><label>圆角</label><input type="number" data-k="r" min="0" step="0.5"><span class="unit">mm</span></div>
    <div class="row"><label>出血</label><input type="number" data-k="bleed" min="0" step="0.5"><span class="unit">mm　图片向外多留的边</span></div>
  </section>
  <section class="sec">
    <h3>相纸</h3>
    <div class="row"><label>规格</label><select id="paperSel"></select></div>
    <div class="row"><label>尺寸</label><input type="number" data-k="pw" min="20"><span>×</span><input type="number" data-k="ph" min="20"><span class="unit">mm</span></div>
    <div class="row"><label>方向</label>
      <div class="seg" id="orientSeg"><button data-v="auto">自动最省</button><button data-v="p">竖</button><button data-v="l">横</button></div>
    </div>
    <div class="row"><label>间距</label><input type="number" data-k="gap" min="0" step="0.5"><span class="unit">mm</span>
      <label style="min-width:auto;margin-left:6px">页边</label><input type="number" data-k="margin" min="0" step="0.5"><span class="unit">mm</span></div>
  </section>
  </details>

  <section class="sec">
    <h3>打印选项</h3>
    <div class="row"><label>裁切线</label>
      <div class="seg" id="marksSeg"><button data-v="outline">轮廓线</button><button data-v="marks">角线</button><button data-v="none">无</button></div>
    </div>
    <div class="row"><label>分辨率</label>
      <div class="seg" id="dpiSeg"><button data-v="300">300 dpi</button><button data-v="600">600 dpi</button></div>
    </div>
  </section>
</aside>

<main>
  <div class="bar">
    <div class="info" id="info"></div>
    <div class="pager" id="pager"></div>
    <button class="btn" id="fillBtn" title="把最后一张图片的数量补到刚好排满整页">补满整页</button>
    <button class="btn" id="pngBtn">当前页 PNG</button>
    <button class="btn" id="jpgBtn">当前页 JPG</button>
    <button class="btn pri" id="pdfBtn">导出 PDF（全部页）</button>
  </div>
  <div class="stage" id="stage"><canvas id="pv"></canvas></div>
  <div class="hint">点相纸上任意一张即可调整裁剪 · 打印 PDF 时请选「实际大小 / 100%」，不要选「适合页面」</div>
</main>
</div>

<div class="modal" id="edModal">
  <div class="card">
    <h2><span id="edTitle">调整裁剪</span><span class="sp"></span>
      <button class="ico" id="edPrev">‹ 上一张</button><button class="ico" id="edNext">下一张 ›</button></h2>
    <canvas id="edc"></canvas>
    <div class="edtools">
      <span class="small">缩放</span>
      <input type="range" id="zoom" min="0.3" max="5" step="0.01">
      <button class="btn" id="rotL" title="左转90°">⟲</button>
      <button class="btn" id="rotR" title="右转90°">⟳</button>
      <button class="btn" id="flip" title="水平翻转">⇋</button>
    </div>
    <div class="edtools">
      <span class="small" style="flex:1">拖动移动 · 滚轮/双指缩放 · 白实线=裁切线，虚线=出血线</span>
      <button class="btn" id="edReset">重置</button>
      <button class="btn dark" id="edDone">完成</button>
    </div>
  </div>
</div>

<div class="modal" id="fbModal">
  <div class="card">
    <h2>文件已生成<span class="sp"></span><button class="ico" id="fbClose">✕</button></h2>
    <img id="fbimg" alt="">
    <p class="small" id="fbText">如果没有自动下载，请点下面的链接，或在图片上右键 / 长按保存。</p>
    <a class="btn pri" id="fbLink" download>下载文件</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const PAPERS=[["5寸 (3R)",89,127],["6寸 (4R)",102,152],["7寸 (5R)",127,178],["A6",105,148],["A5",148,210],["A4",210,297],["自定义",0,0]];
const MPRE=[["方形 50×50","rect",50,50,0],["圆角方 50×50","round",50,50,6],["圆形 Ø58","ellipse",58,58,0],["圆形 Ø44","ellipse",44,44,0],["长方 54×86","round",54,86,3],["长方 60×90","rect",60,90,0],["椭圆 50×70","ellipse",50,70,0]];
const DEF={shape:"rect",w:50,h:50,r:0,bleed:0,gap:2,margin:3,pw:102,ph:152,orient:"auto",marks:"outline",dpi:300,tplOn:true,auto:true,T:{paper:1,count:6,shape:"square",gap:2}};
let S=Object.assign({},DEF);
try{const sv=JSON.parse(localStorage.getItem("magnetS")||"null");if(sv)Object.assign(S,sv)}catch(e){}
let items=[],page=0,uid=0;

/* ---------- 绘图核心 ---------- */
function pathShape(ctx,cx,cy,w,h,r,shape){
  ctx.beginPath();
  if(shape==="ellipse"){ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2);return}
  r=shape==="round"?Math.min(r,w/2,h/2):0;
  const x=cx-w/2,y=cy-h/2;
  if(r<=0){ctx.rect(x,y,w,h);return}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function imgScale(it,bw,bh){ // 返回 每原图像素 对应的 box 单位
  const iw=it.img.naturalWidth,ih=it.img.naturalHeight,sw=it.rot%180!==0;
  const ew=sw?ih:iw,eh=sw?iw:ih;
  return {s:Math.max(bw/ew,bh/eh)*it.zoom,ew,eh};
}
function drawImg(ctx,it,cx,cy,bw,bh){
  const {s}=imgScale(it,bw,bh),iw=it.img.naturalWidth,ih=it.img.naturalHeight;
  ctx.save();
  ctx.translate(cx+it.ox*bw,cy+it.oy*bh);
  ctx.rotate(it.rot*Math.PI/180);
  if(it.flip)ctx.scale(-1,1);
  ctx.imageSmoothingQuality="high";
  ctx.drawImage(it.img,-iw*s/2,-ih*s/2,iw*s,ih*s);
  ctx.restore();
}
function clampIt(it){
  const bw=S.w+2*S.bleed,bh=S.h+2*S.bleed,{s,ew,eh}=imgScale(it,bw,bh);
  const mx=Math.abs(ew*s-bw)/2/bw,my=Math.abs(eh*s-bh)/2/bh;
  it.ox=Math.max(-mx,Math.min(mx,it.ox));it.oy=Math.max(-my,Math.min(my,it.oy));
}
function effDpi(it){const bw=S.w+2*S.bleed,bh=S.h+2*S.bleed,{s}=imgScale(it,bw,bh);return 25.4/s}

/* ---------- 排版 ---------- */
function calc(){
  const cw=S.w+2*S.bleed,ch=S.h+2*S.bleed,a=Math.min(S.pw,S.ph),b=Math.max(S.pw,S.ph);
  const f=(pw,ph)=>{const uw=pw-2*S.margin,uh=ph-2*S.margin;
    const cols=Math.max(0,Math.floor((uw+S.gap+1e-6)/(cw+S.gap))),rows=Math.max(0,Math.floor((uh+S.gap+1e-6)/(ch+S.gap)));
    return {pw,ph,cols,rows,n:cols*rows}};
  const P=f(a,b),Lx=f(b,a);
  const g=S.orient==="p"?P:S.orient==="l"?Lx:(Lx.n>P.n?Lx:P);
  const gw=g.cols*cw+(g.cols-1)*S.gap,gh=g.rows*ch+(g.rows-1)*S.gap,x0=(g.pw-gw)/2,y0=(g.ph-gh)/2;
  g.cells=[];for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)g.cells.push({x:x0+c*(cw+S.gap)+cw/2,y:y0+r*(ch+S.gap)+ch/2});
  g.counts=new Map(items.map(it=>[it,it.count]));
  if(S.auto&&items.length&&g.n){const tot=Math.max(1,Math.ceil(items.length/g.n))*g.n,base=Math.floor(tot/items.length),rem=tot%items.length;items.forEach((it,i)=>g.counts.set(it,base+(i<rem?1:0)))}
  g.seq=[];items.forEach(it=>{for(let i=0;i<g.counts.get(it);i++)g.seq.push(it)});
  g.pages=g.n?Math.max(1,Math.ceil(g.seq.length/g.n)):1;g.cw=cw;g.ch=ch;
  return g;
}
function renderPage(ctx,g,p,k,preview){
  ctx.fillStyle="#fff";ctx.fillRect(0,0,g.pw*k,g.ph*k);
  const b=S.bleed,used=[];
  g.cells.forEach((c,i)=>{const it=g.seq[p*g.n+i];const cx=c.x*k,cy=c.y*k;
    if(it){ctx.save();pathShape(ctx,cx,cy,g.cw*k,g.ch*k,(S.r+b)*k,S.shape);ctx.clip();drawImg(ctx,it,cx,cy,g.cw*k,g.ch*k);ctx.restore();used.push(c)}
    else if(preview){ctx.save();ctx.setLineDash([4*k/3,3*k/3]);ctx.strokeStyle="#d9d3c8";ctx.lineWidth=Math.max(1,.3*k);pathShape(ctx,cx,cy,S.w*k,S.h*k,S.r*k,S.shape);ctx.stroke();ctx.restore()}
  });
  if(S.marks==="none")return;
  ctx.save();ctx.lineWidth=Math.max(preview?1:0,.15*k);
  used.forEach(c=>{const cx=c.x*k,cy=c.y*k;
    if(S.marks==="outline"){ctx.strokeStyle="#9a9a9a";pathShape(ctx,cx,cy,S.w*k,S.h*k,S.r*k,S.shape);ctx.stroke();return}
    ctx.strokeStyle="#555";const L=Math.max(.8,Math.min(3,b+S.gap/2))*k,hw=S.w*k/2,hh=S.h*k/2;ctx.beginPath();
    if(S.shape==="ellipse"){[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{const x=cx+dx*hw,y=cy+dy*hh;ctx.moveTo(x,y);ctx.lineTo(x+dx*L,y+dy*L)})}
    else{[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy])=>{const x=cx+dx*hw,y=cy+dy*hh;ctx.moveTo(x,y);ctx.lineTo(x+dx*L,y);ctx.moveTo(x,y);ctx.lineTo(x,y+dy*L)})}
    ctx.stroke()});
  ctx.restore();
}

/* ---------- 预览 ---------- */
let G=null,pvK=1,raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;doRender()})}
function doRender(){
  try{localStorage.setItem("magnetS",JSON.stringify(S))}catch(e){}
  G=calc();if(page>=G.pages)page=G.pages-1;if(page<0)page=0;
  const st=$("#stage"),aw=st.clientWidth-32,ah=st.clientHeight-26,dpr=window.devicePixelRatio||1;
  pvK=Math.max(.5,Math.min(aw/G.pw,(ah>100?ah:aw*1.5)/G.ph));
  const cv=$("#pv");cv.style.width=G.pw*pvK+"px";cv.style.height=G.ph*pvK+"px";
  cv.width=Math.round(G.pw*pvK*dpr);cv.height=Math.round(G.ph*pvK*dpr);
  renderPage(cv.getContext("2d"),G,page,pvK*dpr,true);
  const o=G.pw>G.ph?"横放":"竖放";
  $("#info").innerHTML=G.n?`每页可放 <b>${G.n}</b> 个（${G.cols}×${G.rows}，${o}）· 已排 <b>${G.seq.length}</b> 个 · 共 <b>${G.pages}</b> 页`:`<b style="color:var(--acc)">冰箱贴太大，这张相纸放不下</b>`;
  const pg=$("#pager");pg.innerHTML="";
  if(G.pages>1)for(let i=0;i<G.pages;i++){const bt=document.createElement("button");bt.className="btn"+(i===page?" dark":"");bt.textContent="第"+(i+1)+"页";bt.style.padding="5px 9px";bt.onclick=()=>{page=i;render()};pg.appendChild(bt)}
  renderList();syncUI();
}
$("#pv").addEventListener("click",e=>{if(!G)return;const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/pvK,y=(e.clientY-r.top)/pvK;
  G.cells.forEach((c,i)=>{if(Math.abs(x-c.x)<=G.cw/2&&Math.abs(y-c.y)<=G.ch/2){const it=G.seq[page*G.n+i];if(it)openEd(it);else $("#file").click()}})});
window.addEventListener("resize",render);

/* ---------- 图片列表 ---------- */
function thumb(cv,it){const d=window.devicePixelRatio||1,W=52*d;cv.width=cv.height=W;const ctx=cv.getContext("2d");
  const bw=S.w+2*S.bleed,bh=S.h+2*S.bleed,k=W*.9/Math.max(bw,bh);ctx.clearRect(0,0,W,W);
  ctx.save();pathShape(ctx,W/2,W/2,bw*k,bh*k,(S.r+S.bleed)*k,S.shape);ctx.clip();drawImg(ctx,it,W/2,W/2,bw*k,bh*k);ctx.restore();
  if(S.bleed>0){ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=d;pathShape(ctx,W/2,W/2,S.w*k,S.h*k,S.r*k,S.shape);ctx.stroke()}}
function renderList(){
  const L=$("#list");L.innerHTML="";
  items.forEach(it=>{const el=document.createElement("div");el.className="item";
    const dpi=Math.round(effDpi(it));
    el.innerHTML=`<canvas title="调整裁剪"></canvas><div class="meta"><div class="nm">${it.name.replace(/</g,"&lt;")}</div>
      ${dpi<150?`<div class="warn">⚠ 约 ${dpi} dpi，打印可能发虚</div>`:""}
      ${S.auto?`<span class="cnt">× ${G.counts.get(it)} 张</span>`:`<div class="step"><button data-a="-">−</button><span>${it.count}</span><button data-a="+">+</button></div> <span class="small">张</span>`}</div>
      <button class="ico" data-a="e">✂️ 裁剪</button><button class="ico" data-a="x" title="删除">🗑</button>`;
    thumb(el.querySelector("canvas"),it);
    el.querySelector("canvas").onclick=()=>openEd(it);
    el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
      if(a==="+")it.count++;if(a==="-")it.count=Math.max(0,it.count-1);
      if(a==="e")return openEd(it);if(a==="x"){items=items.filter(x=>x!==it);URL.revokeObjectURL(it.url)}render()};
    L.appendChild(el)});
}
function addFiles(files){
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{items.push({id:++uid,name:f.name||"粘贴的图片",img,url,count:1,zoom:1,ox:0,oy:0,rot:0,flip:false});render()};
    img.onerror=()=>toast("这张图片打不开："+(f.name||""));img.src=url});
}
$("#drop").onclick=()=>$("#file").click();
$("#file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
["dragover","dragenter"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$("#drop").classList.add("over")}));
["dragleave","drop"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$("#drop").classList.remove("over")}));
document.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
document.addEventListener("paste",e=>{const fs=[...(e.clipboardData||{}).items||[]].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);if(fs.length){addFiles(fs);toast("已粘贴 "+fs.length+" 张图片")}});
$("#fillBtn").onclick=()=>{if(!items.length)return toast("先添加图片");const g=calc();if(!g.n)return;const rem=g.pages*g.n-g.seq.length;
  if(rem===0)return toast("已经刚好排满了");items[items.length-1].count+=rem;page=g.pages-1;render();toast("已补 "+rem+" 张")};

/* ---------- 设置面板 ---------- */
MPRE.forEach(p=>{const b=document.createElement("button");b.className="chip";b.textContent=p[0];b.onclick=()=>{S.tplOn=false;S.shape=p[1];S.w=p[2];S.h=p[3];S.r=p[4];items.forEach(clampIt);render()};b._p=p;$("#mpresets").appendChild(b)});
PAPERS.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p[1]?`${p[0]}　${p[1]}×${p[2]}mm`:p[0];$("#paperSel").appendChild(o)});
$("#paperSel").onchange=e=>{S.tplOn=false;const p=PAPERS[e.target.value];if(p[1]){S.pw=p[1];S.ph=p[2]}render()};
document.querySelectorAll("input[data-k]").forEach(inp=>inp.addEventListener("input",()=>{const v=parseFloat(inp.value);if(isNaN(v))return;S[inp.dataset.k]=Math.max(0,v);S.tplOn=false;items.forEach(clampIt);render()}));
function seg(id,key,num,adv){document.querySelectorAll(id+" button").forEach(b=>b.onclick=()=>{if(adv)S.tplOn=false;S[key]=num?+b.dataset.v:b.dataset.v;items.forEach(clampIt);render()})}
seg("#shapeSeg","shape",0,1);seg("#orientSeg","orient",0,1);seg("#marksSeg","marks");seg("#dpiSeg","dpi",true);
/* ---------- 模板 ---------- */
const GRIDS=[[1,2],[2,2],[2,3],[2,4],[3,3],[3,4],[3,5],[4,5],[4,6],[5,6],[5,7],[6,8]],TPAPER=[[0,"5寸"],[1,"6寸"],[2,"7寸"],[5,"A4"]],SHN={square:"方形",round:"圆角",circle:"圆形",fill:"长方"};
function fitN(a,b,w,h,g,m){return Math.floor((a-2*m+g+1e-6)/(w+g))*Math.floor((b-2*m+g+1e-6)/(h+g))}
function tplOpts(){const T=S.T,p=PAPERS[T.paper],a=p[1],b=p[2],m=3,g=+T.gap,o=new Map();
  GRIDS.forEach(([c,r])=>{let w=Math.floor((a-2*m-(c-1)*g)/c*2)/2,h=Math.floor((b-2*m-(r-1)*g)/r*2)/2;if(T.shape!=="fill")w=h=Math.min(w,h);
    const n=fitN(a,b,w,h,g,m);if(n<1||w<15)return;const pv=o.get(n);if(!pv||w*h>pv.w*pv.h)o.set(n,{n,w,h})});
  return [...o.values()].sort((x,y)=>x.n-y.n)}
function applyTpl(){const T=S.T,p=PAPERS[T.paper],m=3,g=+T.gap,a=p[1],b=p[2],opts=tplOpts();
  let o=opts.find(x=>x.n===T.count);if(!o){o=opts.reduce((x,y)=>Math.abs(y.n-T.count)<Math.abs(x.n-T.count)?y:x);T.count=o.n}
  const w=o.w,h=o.h;
  Object.assign(S,{pw:a,ph:b,orient:"p",gap:g,margin:m,bleed:0,w,h,shape:T.shape==="circle"?"ellipse":T.shape==="round"?"round":"rect",r:T.shape==="round"?Math.round(w*.12):0,tplOn:true});
  items.forEach(clampIt)}
function tChip(box,label,on,fn){const b=document.createElement("button");b.className="chip";b.textContent=label;b._on=on;b.onclick=()=>{fn();applyTpl();render()};box.appendChild(b)}
TPAPER.forEach(([i,n])=>tChip($("#tPaper"),n,()=>S.T.paper===i,()=>S.T.paper=i));
function buildCounts(){const box=$("#tCount");box.innerHTML="";tplOpts().forEach(o=>tChip(box,o.n+"个",()=>S.T.count===o.n,()=>S.T.count=o.n))}
document.querySelectorAll("#tShape button").forEach(b=>b.onclick=()=>{S.T.shape=b.dataset.v;applyTpl();render()});
document.querySelectorAll("#tGap button").forEach(b=>b.onclick=()=>{S.T.gap=+b.dataset.v;applyTpl();render()});
$("#autoChk").onchange=e=>{S.auto=e.target.checked;render()};
function syncUI(){
  buildCounts();
  document.querySelectorAll("#tPaper .chip,#tCount .chip").forEach(b=>b.classList.toggle("on",S.tplOn&&b._on()));
  document.querySelectorAll("#tShape button").forEach(b=>b.classList.toggle("on",S.tplOn&&b.dataset.v===S.T.shape));
  document.querySelectorAll("#tGap button").forEach(b=>b.classList.toggle("on",S.tplOn&&+b.dataset.v===+S.T.gap));
  const ts=$("#tSum");ts.classList.toggle("off",!S.tplOn);
  ts.textContent=S.tplOn?`→ 每个 ${S.w}×${S.h}mm，一张排 ${G?G.n:"-"} 个`:"正在使用高级自定义参数，点上面任意选项可切回模板";
  $("#autoChk").checked=!!S.auto;$("#fillBtn").style.display=S.auto?"none":"";
  document.querySelectorAll("input[data-k]").forEach(inp=>{if(document.activeElement!==inp)inp.value=S[inp.dataset.k]});
  [["#shapeSeg","shape"],["#orientSeg","orient"],["#marksSeg","marks"],["#dpiSeg","dpi"]].forEach(([id,k])=>document.querySelectorAll(id+" button").forEach(b=>b.classList.toggle("on",b.dataset.v==String(S[k]))));
  $("#rRow").style.display=S.shape==="round"?"":"none";
  document.querySelectorAll("#mpresets .chip").forEach(b=>{const p=b._p;b.classList.toggle("on",p[1]===S.shape&&p[2]===S.w&&p[3]===S.h&&(p[1]!=="round"||p[4]===S.r))});
  const a=Math.min(S.pw,S.ph),b=Math.max(S.pw,S.ph);let idx=PAPERS.findIndex(p=>p[1]===a&&p[2]===b);if(idx<0)idx=PAPERS.length-1;$("#paperSel").value=idx;
}

/* ---------- 裁剪编辑器 ---------- */
let ed=null;const edc=$("#edc");
function openEd(it){ed=it;$("#edModal").classList.add("show");$("#zoom").value=it.zoom;sizeEd();drawEd()}
function sizeEd(){const d=window.devicePixelRatio||1,w=edc.clientWidth||440;edc.width=edc.height=Math.round(w*d)}
function edGeo(){const W=edc.width,bw=S.w+2*S.bleed,bh=S.h+2*S.bleed,k=W*.62/Math.max(bw,bh);return{W,k,bw:bw*k,bh:bh*k}}
function drawEd(){if(!ed)return;const ctx=edc.getContext("2d"),{W,k,bw,bh}=edGeo(),c=W/2,d=window.devicePixelRatio||1;
  ctx.fillStyle="#2a2a2e";ctx.fillRect(0,0,W,W);
  ctx.save();ctx.globalAlpha=.3;drawImg(ctx,ed,c,c,bw,bh);ctx.restore();
  ctx.save();pathShape(ctx,c,c,bw,bh,(S.r+S.bleed)*k,S.shape);ctx.clip();ctx.fillStyle="#fff";ctx.fillRect(0,0,W,W);drawImg(ctx,ed,c,c,bw,bh);ctx.restore();
  ctx.lineWidth=2*d;ctx.strokeStyle="#fff";pathShape(ctx,c,c,S.w*k,S.h*k,S.r*k,S.shape);ctx.stroke();
  if(S.bleed>0){ctx.setLineDash([6*d,5*d]);ctx.lineWidth=1.2*d;ctx.strokeStyle="rgba(255,255,255,.75)";pathShape(ctx,c,c,bw,bh,(S.r+S.bleed)*k,S.shape);ctx.stroke();ctx.setLineDash([])}
  const i=items.indexOf(ed);$("#edTitle").textContent=`调整裁剪（${i+1}/${items.length}）`;
}
function edChange(){clampIt(ed);drawEd();render()}
const ptrs=new Map();let pinch0=0,zoom0=1;
edc.addEventListener("pointerdown",e=>{edc.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=ed.zoom}});
edc.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId)||!ed)return;const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];ed.zoom=Math.max(.3,Math.min(5,zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0));$("#zoom").value=ed.zoom}
  else{const{bw,bh}=edGeo(),d=edc.width/edc.clientWidth;ed.ox+=dx*d/bw;ed.oy+=dy*d/bh}edChange()});
["pointerup","pointercancel"].forEach(t=>edc.addEventListener(t,e=>ptrs.delete(e.pointerId)));
edc.addEventListener("wheel",e=>{e.preventDefault();ed.zoom=Math.max(.3,Math.min(5,ed.zoom*Math.exp(-e.deltaY*.0015)));$("#zoom").value=ed.zoom;edChange()},{passive:false});
$("#zoom").oninput=e=>{ed.zoom=+e.target.value;edChange()};
$("#rotL").onclick=()=>{ed.rot=(ed.rot+270)%360;edChange()};
$("#rotR").onclick=()=>{ed.rot=(ed.rot+90)%360;edChange()};
$("#flip").onclick=()=>{ed.flip=!ed.flip;edChange()};
$("#edReset").onclick=()=>{Object.assign(ed,{zoom:1,ox:0,oy:0,rot:0,flip:false});$("#zoom").value=1;edChange()};
$("#edDone").onclick=()=>{$("#edModal").classList.remove("show");ed=null};
$("#edModal").addEventListener("click",e=>{if(e.target.id==="edModal")$("#edDone").click()});
function edGo(d){if(!items.length)return;const i=(items.indexOf(ed)+d+items.length)%items.length;openEd(items[i])}
$("#edPrev").onclick=()=>edGo(-1);$("#edNext").onclick=()=>edGo(1);
document.addEventListener("keydown",e=>{if(!ed)return;if(e.key==="Escape"||e.key==="Enter")$("#edDone").click();if(e.key==="ArrowLeft")edGo(-1);if(e.key==="ArrowRight")edGo(1)});

/* ---------- 导出 ---------- */
let dlP=null;
function getDL(){if(!dlP)dlP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use("downloads")).catch(()=>null):Promise.resolve(null);return dlP}
setTimeout(getDL,50);
function toast(t,ms=2200){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),ms)}
function hiCanvas(g,p){const k=S.dpi/25.4,c=document.createElement("canvas");c.width=Math.round(g.pw*k);c.height=Math.round(g.ph*k);renderPage(c.getContext("2d"),g,p,k,false);return c}
function paperName(g){const a=Math.min(g.pw,g.ph),b=Math.max(g.pw,g.ph),p=PAPERS.find(p=>p[1]===a&&p[2]===b);return p?p[0].split(" ")[0]:`${g.pw}x${g.ph}mm`}
async function saveBlob(blob,name,isImg){
  const dl=await getDL();
  if(dl){try{await dl.save({filename:name,data:blob});toast("已保存 "+name);return}catch(e){if(e&&e.code==="declined"){toast("已取消");return}}}
  const url=URL.createObjectURL(blob);$("#fbLink").href=url;$("#fbLink").download=name;
  $("#fbimg").style.display=isImg?"":"none";if(isImg)$("#fbimg").src=url;$("#fbModal").classList.add("show");
}
$("#fbClose").onclick=()=>$("#fbModal").classList.remove("show");
async function exportImg(type){
  const g=calc();if(!g.seq.length)return toast("先添加图片");if(!g.n)return;
  toast("正在生成…",8000);await new Promise(r=>setTimeout(r,30));
  const c=hiCanvas(g,page);
  c.toBlob(b=>saveBlob(b,`冰箱贴_${paperName(g)}_${S.dpi}dpi_第${page+1}页.${type==="png"?"png":"jpg"}`,true),type==="png"?"image/png":"image/jpeg",.95);
}
$("#pngBtn").onclick=()=>exportImg("png");
$("#jpgBtn").onclick=()=>exportImg("jpg");
$("#pdfBtn").onclick=async()=>{
  const g=calc();if(!g.seq.length)return toast("先添加图片");if(!g.n)return;
  if(!window.jspdf)return toast("PDF 组件没加载出来，请用 PNG/JPG 导出");
  toast(`正在生成 ${g.pages} 页 PDF…`,15000);await new Promise(r=>setTimeout(r,30));
  const ori=g.pw>g.ph?"landscape":"portrait",doc=new window.jspdf.jsPDF({orientation:ori,unit:"mm",format:[g.pw,g.ph]});
  for(let p=0;p<g.pages;p++){if(p)doc.addPage([g.pw,g.ph],ori);doc.addImage(hiCanvas(g,p).toDataURL("image/jpeg",.95),"JPEG",0,0,g.pw,g.ph)}
  saveBlob(doc.output("blob"),`冰箱贴_${paperName(g)}_${g.pages}页.pdf`,false);
};

if(S.tplOn)applyTpl();
doRender();
</script>
</body>
</html>
